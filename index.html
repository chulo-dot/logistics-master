<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Logistics Master</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#0b1220;--card:#111827;--b:#2a3a52;--t:#f0f4ff;--t2:#94a3b8;--ac:#3b82f6;--ok:#10b981;--er:#ef4444;--sans:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
@media(prefers-color-scheme:light){:root{--bg:#f1f5f9;--card:#fff;--b:#e2e8f0;--t:#0f172a;--t2:#475569}}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(900px 500px at 15% -10%,rgba(59,130,246,.18),transparent),var(--bg);color:var(--t);font:400 14px/1.5 var(--sans)}
.wrap{width:100%;max-width:880px;display:grid;grid-template-columns:1.1fr 1fr;gap:28px;align-items:center}
@media(max-width:760px){.wrap{grid-template-columns:1fr}}
h1{font-size:2rem;font-weight:600;margin:.4rem 0;letter-spacing:-.02em}.lead{color:var(--t2);margin:0 0 1rem}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;background:rgba(59,130,246,.15);color:var(--ac);font-size:12px;font-weight:500}
ul{padding:0;list-style:none;color:var(--t2);display:grid;gap:6px}li::before{content:"✓ ";color:var(--ok)}
.card{background:var(--card);border:1px solid var(--b);border-radius:14px;padding:22px;box-shadow:0 1px 3px rgba(0,0,0,.15),0 12px 32px rgba(0,0,0,.18)}
.tabs{display:flex;gap:4px;margin-bottom:16px;border-bottom:1px solid var(--b)}.tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;color:var(--t2);padding:8px;font:500 13px var(--sans);cursor:pointer}.tabs .on{color:var(--t);border-color:var(--ac)}
label{display:block;font-size:12px;font-weight:500;color:var(--t2);margin:12px 0 4px}
input{width:100%;padding:9px 11px;border:1px solid var(--b);border-radius:6px;background:transparent;color:var(--t);font:inherit}input:focus{outline:2px solid var(--ac);outline-offset:1px}
.btn{width:100%;margin-top:16px;padding:10px;border:0;border-radius:8px;background:var(--ac);color:#fff;font:600 14px var(--sans);cursor:pointer}.btn:disabled{opacity:.5}
.link{background:none;border:0;color:var(--ac);cursor:pointer;font:500 12px var(--sans);padding:0;margin-top:10px}
.msg{min-height:1.3em;margin-top:10px;font-size:12.5px}.ok{color:var(--ok)}.er{color:var(--er)}.hp{position:absolute;left:-9999px}
[hidden]{display:none!important}
</style></head><body>
<div class="wrap">
  <section><span class="pill">Logistics Master</span><h1>Outbound planning, aging and dispatch in one place.</h1>
    <p class="lead">Private workspace for your logistics team. Access is by approval.</p>
    <ul><li>Live outbound aging by branch and shipping point</li><li>Load builder with vehicle suggestions</li><li>Shared dispatch history for every terminal</li></ul></section>
  <section class="card">
    <div class="tabs" id="tabs"><button class="on" data-p="in">Sign in</button><button data-p="req">Request access</button></div>
    <div id="in">
      <label for="e1">Email</label><input id="e1" type="email" autocomplete="username">
      <label for="p1">Password</label><input id="p1" type="password" autocomplete="current-password">
      <button class="btn" id="goIn">Sign in</button><button class="link" id="forgot" type="button">Forgot password?</button><div class="msg" id="m1" role="status"></div>
    </div>
    <div id="req" hidden>
      <label for="n2">Full name</label><input id="n2" maxlength="80" autocomplete="name">
      <label for="e2">Work email</label><input id="e2" type="email" maxlength="120" autocomplete="email">
      <label for="d2">Depot / branch (optional)</label><input id="d2" maxlength="80">
      <input class="hp" id="hp" tabindex="-1" autocomplete="off" aria-hidden="true">
      <button class="btn" id="goReq">Request access</button><div class="msg" id="m2" role="status"></div>
    </div>
    <div id="reset" hidden>
      <label for="p3">New password (min 8 characters)</label><input id="p3" type="password" autocomplete="new-password">
      <button class="btn" id="goReset">Save password</button><div class="msg" id="m3" role="status"></div>
    </div>
  </section>
</div>
<script>
const SUPABASE_URL = 'https://hbevnvglrltdcliqhwbx.supabase.co', SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhiZXZudmdscmx0ZGNsaXFod2J4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI2MDg1NDMsImV4cCI6MjEwODE4NDU0M30.4QDmQibzN8zxhPa2-gncpT03Adt1nrecHVx1XDu0doc', APP_URL = 'app.html';   // ← fill in (anon key is public by design)
const $ = id => document.getElementById(id), sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const say = (id, t, ok) => { const m = $(id); m.textContent = t; m.className = 'msg ' + (ok ? 'ok' : 'er'); };
const show = p => { ['in','req','reset'].forEach(x => $(x).hidden = x !== p); document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.p === p)); $('tabs').hidden = p === 'reset'; };
$('tabs').onclick = e => { const p = e.target.dataset.p; if(p) show(p); };
$('goIn').onclick = async () => { $('goIn').disabled = true; say('m1', 'Signing in…', true);
  const {error} = await sb.auth.signInWithPassword({email:$('e1').value.trim(), password:$('p1').value});
  if(error){ say('m1', 'Wrong email or password.'); $('goIn').disabled = false; } else location.href = APP_URL; };
$('p1').onkeydown = e => { if(e.key === 'Enter') $('goIn').click(); };
$('forgot').onclick = async () => { const e = $('e1').value.trim(); if(!e) return say('m1', 'Type your email above first.');
  const {error} = await sb.auth.resetPasswordForEmail(e, {redirectTo: location.origin + location.pathname});
  say('m1', error ? 'Could not send the email. Try again later.' : 'If that email has an account, a reset link is on its way.', !error); };
$('goReq').onclick = async () => { if($('hp').value) return;
  const full_name = $('n2').value.trim(), email = $('e2').value.trim().toLowerCase();
  if(full_name.length < 2 || !/^\S+@\S+\.\S+$/.test(email)) return say('m2', 'Enter your name and a valid email.');
  $('goReq').disabled = true;
  const {error} = await sb.from('access_requests').insert({full_name, email, depot:$('d2').value.trim() || null});
  if(!error) say('m2', 'Request sent. An administrator will contact you once approved.', true);
  else say('m2', error.code === '23505' ? 'A request for this email is already pending.' : 'Could not send the request. Try again later.');
  $('goReq').disabled = false; };
sb.auth.onAuthStateChange((ev) => { if(ev === 'PASSWORD_RECOVERY') show('reset'); });
$('goReset').onclick = async () => { const {error} = await sb.auth.updateUser({password:$('p3').value});
  if(error) say('m3', error.message); else { say('m3', 'Password saved. Opening the app…', true); setTimeout(() => location.href = APP_URL, 900); } };
sb.auth.getSession().then(({data}) => { if(data.session && !location.hash.includes('type=recovery')) location.href = APP_URL; });
</script></body></html>
